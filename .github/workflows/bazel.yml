name: Bazel

on:
  workflow_dispatch:
    inputs:
      cache_benchmark:
        description: Compare caches, measure the baseline, or inspect remote cache hits
        type: choice
        default: "off"
        options:
          - "off"
          - baseline
          - compare
          - remote
      remote_instance_amd64:
        description: Existing AMD64 remote_instance_name from summary.json (remote mode)
        type: string
        default: ""
      remote_instance_arm64:
        description: Existing ARM64 remote_instance_name from summary.json (remote mode)
        type: string
        default: ""
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.cache_benchmark == 'off' }}
    name: Bazel (${{ matrix.arch }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            bazel_args: ""
          - arch: ARM64
            runner: ubuntu-24.04-arm
            bazel_args: --config=aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates gdb git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git for the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-version: "8.5.1"

      - name: Test registry evidence checks
        run: python3 -m unittest discover -s tools/bazel -p go_validation_test.py -v

      - name: Record Rust source inputs
        shell: bash
        run: |
          test ! -e Cargo.Bazel.lock
          test -z "$(git ls-files Cargo.Bazel.lock)"
          git ls-files --error-unmatch Cargo.lock
          mkdir -p artifacts/validation
          cp Cargo.lock artifacts/validation/
          git rev-parse HEAD > artifacts/validation/source-commit.txt
          git rev-parse HEAD^{tree} > artifacts/validation/source-tree.txt

      - name: Record maintained registry inputs
        run: python3 tools/bazel/go_validation.py record artifacts/validation

      - name: Record native build inputs
        run: |
          test ! -e MODULE.bazel.lock
          mkdir -p artifacts/validation
          uname -m > artifacts/validation/runner-architecture.txt
          dpkg --print-architecture > artifacts/validation/userspace-architecture.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/validation/tested-revision.txt
          bazel version > artifacts/validation/bazel-version.txt

      - name: Check Bazel formatting
        run: bazel run ${{ matrix.bazel_args }} //tools/bazel/buildifier:buildifier.format.check

      - name: Check cache benchmark isolation and reporting
        run: python3 -m unittest discover -s tools/bazel -p test_cache_benchmark.py

      - name: Build and test with YANG
        run: >-
          bazel test
          ${{ matrix.bazel_args }}
          --lockfile_mode=update
          --nocache_test_results
          --execution_log_compact_file=artifacts/validation/yang-actions.binpb.zst
          --build_event_json_file=artifacts/validation/yang-events.json
          --//tools/bazel:yang_modules=True
          --test_output=errors
          --verbose_failures
          --sandbox_debug
          //common:cfg_schema_generated
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //crates/swss-common:bindings_dir
          //crates/swss-common:swss_common
          //crates/swss-common:swss_common_test
          //tools/bazel/rust:shared_serde_test
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tests:defaultvalueprovider_ut
          //dist:libswsscommon_package_test
          //dist:package_timestamps_test
          //pyext:swsscommon_package_test

      - name: Collect YANG package artifacts
        run: |
          test ! -e Cargo.Bazel.lock
          git diff --exit-code HEAD -- Cargo.lock
          mkdir -p artifacts/yang artifacts/validation/yang
          cp artifacts/validation/effective.bazelrc artifacts/yang/effective.bazelrc
          cp MODULE.bazel.lock artifacts/yang/
          cp bazel-testlogs/crates/swss-common/swss_common_test/test.xml bazel-testlogs/crates/swss-common/swss_common_test/test.log artifacts/validation/yang/
          mkdir -p artifacts/validation/yang/shared-serde
          cp bazel-testlogs/tools/bazel/rust/shared_serde_test/test.xml bazel-testlogs/tools/bazel/rust/shared_serde_test/test.log artifacts/validation/yang/shared-serde/
          cp MODULE.bazel.lock artifacts/validation/yang/
          mkdir -p artifacts/validation/yang/go
          cp -L bazel-testlogs/goext/swsscommon_runtime_test/test.log bazel-testlogs/goext/swsscommon_runtime_test/test.xml artifacts/validation/yang/go/
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/yang/

      - name: Build and test without YANG
        run: >-
          bazel test
          ${{ matrix.bazel_args }}
          --lockfile_mode=update
          --nocache_test_results
          --execution_log_compact_file=artifacts/validation/no-yang-actions.binpb.zst
          --build_event_json_file=artifacts/validation/no-yang-events.json
          --//tools/bazel:yang_modules=False
          --test_output=errors
          --verbose_failures
          --sandbox_debug
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //crates/swss-common:bindings_dir
          //crates/swss-common:swss_common
          //crates/swss-common:swss_common_test
          //tools/bazel/rust:shared_serde_test
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //dist:libswsscommon_package_test
          //dist:package_timestamps_test
          //pyext:swsscommon_package_test

      - name: Collect no-YANG package artifacts
        run: |
          test ! -e Cargo.Bazel.lock
          git diff --exit-code HEAD -- Cargo.lock
          mkdir -p artifacts/no-yang artifacts/validation/no-yang
          cp artifacts/validation/effective.bazelrc artifacts/no-yang/effective.bazelrc
          cp MODULE.bazel.lock artifacts/no-yang/
          cp bazel-testlogs/crates/swss-common/swss_common_test/test.xml bazel-testlogs/crates/swss-common/swss_common_test/test.log artifacts/validation/no-yang/
          mkdir -p artifacts/validation/no-yang/shared-serde
          cp bazel-testlogs/tools/bazel/rust/shared_serde_test/test.xml bazel-testlogs/tools/bazel/rust/shared_serde_test/test.log artifacts/validation/no-yang/shared-serde/
          cp MODULE.bazel.lock artifacts/validation/no-yang/
          mkdir -p artifacts/validation/no-yang/go
          cp -L bazel-testlogs/goext/swsscommon_runtime_test/test.log bazel-testlogs/goext/swsscommon_runtime_test/test.xml artifacts/validation/no-yang/go/
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/no-yang/

      - name: Upload YANG package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-yang-${{ matrix.arch }}
          path: artifacts/yang/
          if-no-files-found: error

      - name: Upload no-YANG package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-no-yang-${{ matrix.arch }}
          path: artifacts/no-yang/
          if-no-files-found: error

      - name: Retain Go builder failure evidence
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          output_base="$(bazel info output_base)"
          python3 tools/bazel/diagnose_go_builder.py \
            --output-base "$output_base" \
            --destination artifacts/validation/go-builder-failure

      - name: Upload Rust validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-rust-${{ matrix.arch }}
          path: artifacts/validation/
          if-no-files-found: error

      - name: Record resolved Go inputs
        if: always()
        run: python3 tools/bazel/go_validation.py collect artifacts/validation ${{ matrix.bazel_args }}

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-go-validation-${{ matrix.arch }}
          path: artifacts/validation/
          if-no-files-found: error

  cgo-headers:
    name: Cgo headers (${{ matrix.arch }}, external includes ${{ matrix.external_includes }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64, ARM64]
        external_includes: [enabled, disabled]
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            bazel_args: ""
          - arch: ARM64
            runner: ubuntu-24.04-arm
            bazel_args: --config=aarch64
          - external_includes: enabled
            feature: external_include_paths
          - external_includes: disabled
            feature: -external_include_paths
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git python3 tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-cgo-headers
          cache-version: "8.5.1"
      - name: Record maintained registry inputs
        run: python3 tools/bazel/go_validation.py record artifacts/validation
      - name: Test direct cgo use of the imported hiredis headers
        run: |
          test ! -e MODULE.bazel.lock
          mkdir -p artifacts/validation
          uname -m > artifacts/validation/runner-architecture.txt
          dpkg --print-architecture > artifacts/validation/userspace-architecture.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/validation/tested-revision.txt
          bazel test ${{ matrix.bazel_args }} \
            --lockfile_mode=update \
            --nocache_test_results \
            --//tools/bazel:yang_modules=False \
            --features=${{ matrix.feature }} \
            --execution_log_json_file=artifacts/validation/cgo-actions.json \
            --test_output=errors \
            //goext/tests/hiredis:hiredis_cgo_test
      - name: Collect cgo header evidence
        if: always()
        run: |
          mkdir -p artifacts/validation
          if test -d bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test; then
            cp -L bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test/test.log bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test/test.xml artifacts/validation/
          fi
      - name: Record resolved Go inputs
        if: always()
        run: python3 tools/bazel/go_validation.py collect artifacts/validation ${{ matrix.bazel_args }}
      - name: Upload cgo header evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-cgo-headers-${{ matrix.arch }}-${{ matrix.external_includes }}
          path: artifacts/validation/
          if-no-files-found: error

  cache-benchmark:
    name: Cache benchmark (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_benchmark != 'off' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates gdb git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ inputs.cache_benchmark != 'remote' && github.workflow || '' }}
          cache-version: "8.5.1"

      - name: Measure build and test times
        env:
          BUILDBUDDY_API_KEY: ${{ (inputs.cache_benchmark == 'compare' || inputs.cache_benchmark == 'remote') && secrets.BUILDBUDDY_API_KEY || '' }}
          BENCHMARK_MODE: ${{ inputs.cache_benchmark }}
          BENCHMARK_ARCH: ${{ matrix.arch }}
          REMOTE_INSTANCE_AMD64: ${{ inputs.remote_instance_amd64 }}
          REMOTE_INSTANCE_ARM64: ${{ inputs.remote_instance_arm64 }}
        run: |
          if [ "$BENCHMARK_MODE" = remote ]; then
            case "$BENCHMARK_ARCH" in
              AMD64) REMOTE_INSTANCE_NAME="$REMOTE_INSTANCE_AMD64" ;;
              ARM64) REMOTE_INSTANCE_NAME="$REMOTE_INSTANCE_ARM64" ;;
            esac
            set -- --remote-instance-name "$REMOTE_INSTANCE_NAME"
          else
            mkdir -p "$HOME/.cache/bazel-disk"
            set -- --disk-cache "$HOME/.cache/bazel-disk"
          fi
          python3 tools/bazel/cache_benchmark.py \
            --mode "$BENCHMARK_MODE" \
            --arch "$BENCHMARK_ARCH" \
            --output-dir artifacts/cache-benchmark \
            --repository-cache "$HOME/.cache/bazel-repo" \
            "$@"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-benchmark-${{ matrix.arch }}
          path: artifacts/cache-benchmark/
          if-no-files-found: warn
