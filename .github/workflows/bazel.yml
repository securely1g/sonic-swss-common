name: Repaired rules_go 4583 regression

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 8.5.1

jobs:
  regression:
    name: Repaired 4583 (${{ matrix.arch }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install native execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: false
          cache-version: "rules-go-4583-fixed-bazel-8.5.1"

      - name: Run original and compatible test harnesses
        run: |
          mkdir -p artifacts/original-4583
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/original-4583/tested-revision.txt
          uname -m > artifacts/original-4583/runner-architecture.txt
          dpkg --print-architecture > artifacts/original-4583/userspace-architecture.txt
          gcc --version > artifacts/original-4583/compiler-version.txt
          python3 tools/bazel/rules_go_4583/run.py --artifacts "$GITHUB_WORKSPACE/artifacts/original-4583"

      - name: Verify tracked sources are unchanged
        if: always()
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code > artifacts/original-4583/tracked-files.diff

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rules-go-4583-fixed-${{ matrix.arch }}
          path: artifacts/original-4583/
          if-no-files-found: error
