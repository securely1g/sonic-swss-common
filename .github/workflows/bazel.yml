name: Bazel
run-name: Bazel validation

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  native-amd64:
    name: Native AMD64
    uses: ./.github/workflows/bazel-native.yml
    with:
      arch: AMD64
      runner: ubuntu-24.04
      bazel_args: ""

  bazel-amd64:
    name: Bazel (AMD64)
    if: ${{ always() }}
    needs: native-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native feature modes
        env:
          NATIVE_RESULT: ${{ needs.native-amd64.result }}
        run: test "$NATIVE_RESULT" = success

  native-arm64:
    name: Native ARM64
    uses: ./.github/workflows/bazel-native.yml
    with:
      arch: ARM64
      runner: ubuntu-24.04-arm
      bazel_args: "--config=aarch64"

  bazel-arm64:
    name: Bazel (ARM64)
    if: ${{ always() }}
    needs: native-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native feature modes
        env:
          NATIVE_RESULT: ${{ needs.native-arm64.result }}
        run: test "$NATIVE_RESULT" = success

  cgo-headers:
    name: Cgo headers (${{ matrix.arch }}, external includes ${{ matrix.external_includes }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64, ARM64]
        external_includes: [enabled, disabled]
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            bazel_args: ""
          - arch: ARM64
            runner: ubuntu-24.04-arm
            bazel_args: --config=aarch64
          - external_includes: enabled
            feature: external_include_paths
          - external_includes: disabled
            feature: -external_include_paths
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
    steps:
      - name: Install pinned bootstrap tools
        run: |
          # Git and CA certificates must be installed before checkout.
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260918T000000Z trixie main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260918T000000Z trixie-security main' \
            > /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils=2.44-3 build-essential=12.12 ca-certificates=20250419 \
            gdb=16.3-1 git=1:2.47.3-0+deb13u1 python3=3.13.5-1 tar=1.35+dfsg-3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the pinned bootstrap environment
        run: |
          python3 -B tools/bazel/runtime/prepare.py --verify-bootstrap-only \
            --image-reference debian:trixie-20260918@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            --output artifacts/validation/bootstrap-environment.json
          python3 -c 'import json; print("SONIC_BOOTSTRAP_ENVIRONMENT_ID=" + json.load(open("artifacts/validation/bootstrap-environment.json"))["SONIC_BOOTSTRAP_ENVIRONMENT_ID"])' >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-cgo-headers
          cache-version: "8.5.1"
      - name: Record maintained registry inputs
        run: python3 tools/bazel/go_validation.py record artifacts/validation
      - name: Test direct cgo use of the imported hiredis headers
        run: |
          test ! -e MODULE.bazel.lock
          mkdir -p artifacts/validation
          uname -m > artifacts/validation/runner-architecture.txt
          dpkg --print-architecture > artifacts/validation/userspace-architecture.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/validation/tested-revision.txt
          bazel test ${{ matrix.bazel_args }} \
            --action_env=SONIC_BOOTSTRAP_ENVIRONMENT_ID \
            --test_env=SONIC_BOOTSTRAP_ENVIRONMENT_ID \
            --lockfile_mode=update \
            --nocache_test_results \
            --//tools/bazel:yang_modules=False \
            --features=${{ matrix.feature }} \
            --execution_log_json_file=artifacts/validation/cgo-actions.json \
            --test_output=errors \
            //goext/tests/hiredis:hiredis_cgo_test
      - name: Collect cgo header evidence
        if: always()
        run: |
          mkdir -p artifacts/validation
          if test -d bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test; then
            cp -L bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test/test.log bazel-testlogs/goext/tests/hiredis/hiredis_cgo_test/test.xml artifacts/validation/
          fi
      - name: Record resolved Go inputs
        if: always()
        run: python3 tools/bazel/go_validation.py collect artifacts/validation ${{ matrix.bazel_args }}
      - name: Upload cgo header evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-cgo-headers-${{ matrix.arch }}-${{ matrix.external_includes }}
          # Raw Bazel event/action logs can contain environment credentials.
          path: |
            artifacts/validation/
            !artifacts/validation/**/*-events.json
            !artifacts/validation/**/*-actions*
          if-no-files-found: error
