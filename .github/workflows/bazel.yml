name: Bazel

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Bazel (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            bazel_args: ""
          - arch: ARM64
            runner: ubuntu-24.04-arm
            bazel_args: --config=aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-version: "8.5.1"

      - name: Check Bazel formatting
        run: bazel run ${{ matrix.bazel_args }} //tools/bazel/buildifier:buildifier.format.check

      - name: Build and test without YANG
        run: >-
          bazel test
          ${{ matrix.bazel_args }}
          --//tools/bazel:yang_modules=False
          --test_output=errors
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //dist:libswsscommon_pkg
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //dist:libswsscommon_package_test

      - name: Collect package artifacts
        run: |
          mkdir -p artifacts
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-no-yang-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
