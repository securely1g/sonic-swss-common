name: Bazel

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.check_name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            check_name: Bazel native (AMD64)
            runner: ubuntu-24.04
            bazel_args: ""
          - arch: ARM64
            check_name: Bazel (ARM64)
            runner: ubuntu-24.04-arm
            bazel_args: --config=aarch64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates gdb git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-version: "8.5.1"

      - name: Check Bazel formatting
        run: bazel run ${{ matrix.bazel_args }} //tools/bazel/buildifier:buildifier.format.check

      - name: Build and test with YANG
        run: >-
          bazel test
          ${{ matrix.bazel_args }}
          --//tools/bazel:yang_modules=True
          --test_output=errors
          //common:cfg_schema_generated
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tests:defaultvalueprovider_ut
          //dist:libswsscommon_package_test
          //pyext:swsscommon_package_test

      - name: Collect YANG package artifacts
        run: |
          mkdir -p artifacts/yang
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/yang/

      - name: Build and test without YANG
        run: >-
          bazel test
          ${{ matrix.bazel_args }}
          --//tools/bazel:yang_modules=False
          --test_output=errors
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //dist:libswsscommon_package_test
          //pyext:swsscommon_package_test

      - name: Collect no-YANG package artifacts
        run: |
          mkdir -p artifacts/no-yang
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/no-yang/

      - name: Upload YANG package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-yang-${{ matrix.arch }}
          path: artifacts/yang/
          if-no-files-found: error

      - name: Upload no-YANG package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-no-yang-${{ matrix.arch }}
          path: artifacts/no-yang/
          if-no-files-found: error

  armhf:
    name: Bazel (ARMHF)
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    container: debian:trixie-20260918
    steps:
      - name: Install host build and ARMHF execution tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates gdb-multiarch git libxml2 python3 qemu-user tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
          cache-version: "8.5.1"

      - name: Verify ARM64 execution host
        run: |
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          qemu-arm --version

      - name: Build ARMHF outputs and test packages with YANG
        run: >-
          bazel test
          --config=armhf
          --//tools/bazel:yang_modules=True
          --jobs=4
          --test_output=errors
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //dist:libswsscommon_package_test
          //tools/bazel/armhf:python_runtime_test
          //goext:swsscommon_runtime_test
          //common:cfg_schema_generated //tests:defaultvalueprovider_ut

      - name: Run ARMHF compiled tests through QEMU
        run: >-
          bazel test
          --config=armhf
          --//tools/bazel:yang_modules=True
          --jobs=4
          --test_output=errors
          --run_under=//tools/bazel/armhf:qemu_run_under
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tools/bazel/armhf:abi_runtime_test

      - name: Collect package artifacts
        run: |
          mkdir -p artifacts/yang
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/yang/

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-yang-ARMHF
          path: artifacts/yang/
          if-no-files-found: error

      - name: Build ARMHF outputs and test packages without YANG
        run: >-
          bazel test
          --config=armhf
          --//tools/bazel:yang_modules=False
          --jobs=4
          --test_output=errors
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //pyext:swsscommon_pkg
          //goext:swsscommon
          //dist:libswsscommon_package_test
          //tools/bazel/armhf:python_runtime_test
          //goext:swsscommon_runtime_test

      - name: Run ARMHF compiled tests through QEMU
        run: >-
          bazel test
          --config=armhf
          --//tools/bazel:yang_modules=False
          --jobs=4
          --test_output=errors
          --run_under=//tools/bazel/armhf:qemu_run_under
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tools/bazel/armhf:abi_runtime_test

      - name: Collect package artifacts
        run: |
          mkdir -p artifacts/no-yang
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            artifacts/no-yang/

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-no-yang-ARMHF
          path: artifacts/no-yang/
          if-no-files-found: error

  required-builds:
    # Preserve the required context used by master and documentation branches,
    # while making this branch's added ARMHF configuration a merge prerequisite.
    name: Bazel (AMD64)
    if: always()
    needs: [build-and-test, armhf]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported build and test job to pass
        env:
          NATIVE_RESULT: ${{ needs.build-and-test.result }}
          ARMHF_RESULT: ${{ needs.armhf.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$ARMHF_RESULT" = success
