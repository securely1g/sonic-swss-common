# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - 'codex/native-shared-libraries'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        category: "/language:${{matrix.language}}"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918
      options: --init
    timeout-minutes: 90
    outputs:
      native-result: ${{ steps.native-validation.outcome }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Install host build tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          binutils build-essential ca-certificates gdb git python3 tar

    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Configure Git for the container checkout
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        repository-cache: true
        cache-version: "8.5.1"

    - name: Verify Rust source inputs
      run: |
        test ! -e Cargo.Bazel.lock
        test -z "$(git ls-files Cargo.Bazel.lock)"
        git ls-files --error-unmatch Cargo.lock
        test ! -e MODULE.bazel.lock
        mkdir -p artifacts/validation
        cp Cargo.lock artifacts/validation/
        git rev-parse HEAD > artifacts/validation/source-commit.txt
        git rev-parse HEAD^{tree} > artifacts/validation/source-tree.txt
        uname -m > artifacts/validation/runner-architecture.txt
        dpkg --print-architecture > artifacts/validation/userspace-architecture.txt
        bazel version > artifacts/validation/bazel-version.txt

    - name: Record maintained registry inputs
      run: |
        python3 tools/bazel/go_validation.py record artifacts/codeql-go-inputs
        git rev-parse HEAD > artifacts/codeql-go-inputs/tested-revision.txt

    - name: Initialize CodeQL
      id: init
      uses: github/codeql-action/init@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: cpp
        # Match the CLI used by the legacy job, which supports GCC 14.2.
        tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.gz

    - name: Check build reuse and coverage guards
      run: |
        python3 -m unittest discover -s .github/scripts -p 'test_*.py'
        python3 -m unittest discover -s .github/codeql/coverage -p 'test_*.py'

    - name: Build YANG under CodeQL and reuse outputs for tests and packages
      run: python3 .github/scripts/codeql_build_once.py yang

    # Freeze the YANG database and source archive before no-YANG can replace
    # generated files. Run security queries only after native validation.
    - name: Finalize the YANG CodeQL database
      id: finalize
      uses: github/codeql-action/analyze@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        skip-queries: true
        cleanup-level: none
        upload: false

    - name: Restore the environment before running further build steps
      env:
        CODEQL_DATABASES: ${{ steps.finalize.outputs.db-locations }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        database = Path(json.loads(os.environ["CODEQL_DATABASES"])["cpp"])
        tracing = database.parent / "temp/tracingEnvironment"
        start = json.loads((tracing / "start-tracing.json").read_text())
        end = json.loads((tracing / "end-tracing.json").read_text())
        # The pinned action clears its own process environment. Clear persisted
        # job variables too, including keys omitted from end-tracing.json.
        with open(os.environ["GITHUB_ENV"], "a") as stream:
            for key in sorted(start.keys() | end.keys()):
                value = end.get(key) or ""
                if any(c in key + value for c in "\r\n"):
                    raise ValueError("Unexpected multiline tracing environment")
                stream.write(f"{key}={value}\n")
        PY

    - name: Verify C++ source extraction
      shell: bash
      env:
        CODEQL: ${{ steps.init.outputs.codeql-path }}
        CODEQL_DATABASES: ${{ steps.finalize.outputs.db-locations }}
      run: |
        codeql_database="$(python3 -c 'import json, os; print(json.loads(os.environ["CODEQL_DATABASES"])["cpp"])')"
        "$CODEQL" pack install .github/codeql/coverage
        "$CODEQL" query run \
          --database="$codeql_database" \
          --output="$RUNNER_TEMP/common-cpp-files.bqrs" \
          .github/codeql/coverage/CppSourceFiles.ql
        "$CODEQL" bqrs decode \
          --format=csv \
          --output=artifacts/codeql/cpp-source-files.csv \
          "$RUNNER_TEMP/common-cpp-files.bqrs"
        python3 .github/codeql/coverage/check.py \
          --csv artifacts/codeql/cpp-source-files.csv \
          --output artifacts/codeql/source-coverage.json
        "$CODEQL" database bundle "$codeql_database" \
          --output=artifacts/codeql/cpp-database.zip

    # Preserve the original YANG analysis scope and generated-source contents.
    # After environment restoration, restart Bazel before switching features.
    - name: Build and test no-YANG using the same private outputs
      run: python3 .github/scripts/codeql_build_once.py no-yang

    - name: Upload Rust dependency evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-rust-dependencies
        path: |
          Cargo.lock
          MODULE.bazel.lock
        if-no-files-found: error

    # Collect after the analysis archive is finalized and both native modes
    # finish, so input probes cannot populate the cache used by reuse checks.
    - name: Record resolved Go inputs
      if: always()
      run: >-
        python3 tools/bazel/go_validation.py collect artifacts/codeql-go-inputs
        --output-base-file artifacts/codeql-go-inputs/build-output-base.txt

    - name: Retain Go builder failure evidence
      if: failure()
      continue-on-error: true
      shell: bash
      run: |
        if test -f artifacts/codeql-go-inputs/build-output-base.txt; then
          python3 tools/bazel/diagnose_go_builder.py \
            --output-base "$(cat artifacts/codeql-go-inputs/build-output-base.txt)" \
            --destination artifacts/validation/go-builder-failure
        fi

    - name: Upload Rust validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-rust-AMD64
        path: artifacts/validation/
        if-no-files-found: error

    - name: Upload native validation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-go-validation-AMD64
        path: |
          artifacts/validation/
          artifacts/codeql-go-inputs/
        if-no-files-found: error


    - name: Upload YANG package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-yang-AMD64
        path: artifacts/yang/
        if-no-files-found: error

    - name: Upload no-YANG package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-no-yang-AMD64
        path: artifacts/no-yang/
        if-no-files-found: error

    - name: Upload build reuse and extraction evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-cpp
        path: artifacts/codeql/
        if-no-files-found: error

    - name: Upload resolved build inputs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-go-inputs
        path: artifacts/codeql-go-inputs/
        if-no-files-found: error

    # Default success() requires both native modes and all evidence/package
    # uploads above to finish. Security-query or upload failures below remain
    # visible on Analyze (cpp), without changing this completed native result.
    - name: Record completed native validation
      id: native-validation
      run: echo "Both native configurations and their artifacts passed."

    - name: Perform CodeQL Analysis
      id: analyze
      if: ${{ !cancelled() && steps.finalize.outcome == 'success' }}
      uses: github/codeql-action/analyze@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        category: "/language:cpp"

  installed-amd64:
    name: Installed runtime (AMD64, ${{ matrix.mode }})
    needs: analyze-cpp
    if: ${{ !cancelled() && needs.analyze-cpp.outputs.native-result == 'success' }}
    runs-on: ubuntu-24.04
    container: debian:trixie-20260918
    strategy:
      fail-fast: false
      matrix:
        mode: [yang, no-yang]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install runtime validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates git python3 tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sonic-swss-common-${{ matrix.mode }}-AMD64
          path: artifacts/package
      - name: Verify the artifact source and dependency lock
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path("artifacts/package/resolution")
          receipt = json.loads((root / "resolution.json").read_text())
          revision = subprocess.check_output(
              ["git", "-c", "safe.directory=" + os.environ["GITHUB_WORKSPACE"], "rev-parse", "HEAD"], text=True).strip()
          assert receipt["revision"] == revision, "Package came from a different source revision"
          assert hashlib.sha256((root / "MODULE.bazel.lock").read_bytes()).hexdigest() == receipt["files"]["MODULE.bazel.lock"]["sha256"]
          PY
      - name: Prepare the selected native runtime
        run: >-
          python3 -B tools/bazel/runtime/prepare.py
          --lock artifacts/package/resolution/MODULE.bazel.lock
          --image-reference debian:trixie-20260918
          --output artifacts/installed/test-runtime.json
          --env-file "$GITHUB_ENV"
      - name: Test the installed Common and CLI libraries
        shell: bash
        run: |
          installed_runtime_args=()
          if [ '${{ matrix.mode }}' = yang ]; then
            installed_runtime_args+=(--libyang-package artifacts/package/libyang_pkg.tar)
          fi
          chmod +x artifacts/package/common-probe artifacts/package/cli-probe
          python3 -B tools/bazel/runtime/installed_check.py \
            --common-package artifacts/package/libswsscommon_pkg.tar \
            --cli-package artifacts/package/sonic-db-cli_pkg.tar \
            --common-probe artifacts/package/common-probe \
            --cli-probe artifacts/package/cli-probe \
            --output artifacts/installed/installed-runtime.json \
            "${installed_runtime_args[@]}"
      - name: Retain installed runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-installed-AMD64-${{ matrix.mode }}
          path: artifacts/installed
          if-no-files-found: error

  # Preserve the existing required check while doing the AMD64 work once.
  # Missing, failed or skipped native validation cannot pass this gate.
  build-amd64:
    name: Bazel (AMD64)
    needs: [analyze-cpp, installed-amd64]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require native builds, tests, packages and artifacts to pass
        env:
          RESULT: ${{ needs.analyze-cpp.outputs.native-result }}
          INSTALLED_RESULT: ${{ needs.installed-amd64.result }}
        run: test "$RESULT" = success && test "$INSTALLED_RESULT" = success
