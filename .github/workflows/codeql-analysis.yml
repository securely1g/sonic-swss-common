# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        category: "/language:${{matrix.language}}"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-20260918
      options: --init
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Install host build tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          binutils build-essential ca-certificates git python3 tar

    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Configure Git for the container checkout
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        repository-cache: true
        cache-version: "8.5.1"

    - name: Select the maintained registry branch for CI
      run: |
        python3 - <<'PYTHON'
        from pathlib import Path
        path = Path(".bazelrc")
        text = path.read_text()
        reviewed = "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/23c5dd47421393967b0a4790470131d8829cfe9d"
        assert text.count(reviewed) == 1, "Expected one reviewed SONiC registry endpoint"
        path.write_text(text.replace(reviewed, "https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/codex/shared-rust-deps-20261003"))
        PYTHON

    - name: Prepare Rust dependency metadata
      run: |
        python3 -m unittest discover -s tools/bazel -p prepare_rust_test.py
        test ! -e artifacts/rust-deps/overrides.bazelrc
        test ! -e Cargo.Bazel.lock
        python3 tools/bazel/prepare_rust.py --receipt artifacts/rust-preparation.json
        git diff --exit-code HEAD -- Cargo.lock
        test ! -e Cargo.Bazel.lock
        python3 - <<'PYTHON'
        import json
        from pathlib import Path
        import shutil
        receipt = json.loads(Path("artifacts/rust-preparation.json").read_text())
        shared = Path(receipt["shared_dependency"]["workspace"])
        destination = Path("artifacts/shared-rust-deps")
        destination.mkdir(parents=True, exist_ok=True)
        for name in ("Cargo.toml", "Cargo.lock", "Cargo.Bazel.lock", "MODULE.bazel.lock"):
            shutil.copy2(shared / name, destination / name)
        PYTHON

    - name: Initialize CodeQL
      uses: github/codeql-action/init@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: cpp
        # Match the CLI used by the legacy job, which supports GCC 14.2.
        tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.gz

    - name: Build C++ with Bazel
      shell: bash
      run: |
        codeql_bazel_output_base="$(mktemp -d "$RUNNER_TEMP/codeql-bazel-output.XXXXXX")"
        trap 'bazel --output_base="$codeql_bazel_output_base" shutdown' EXIT
        bazel --output_base="$codeql_bazel_output_base" build \
          --//tools/bazel:yang_modules=True \
          --spawn_strategy=local \
          --nouse_action_cache \
          --noremote_accept_cached \
          --noremote_upload_local_results \
          --disk_cache= \
          --remote_cache= \
          --remote_executor= \
          --cxxopt=-nostdinc \
          //:libswsscommon \
          //:swssloglevel \
          //sonic-db-cli:sonic-db-cli \
          //pyext:_swsscommon \
          //tests:codeql_test_sources \
          //tests:shared_library_runtime_test

    - name: Upload Rust preparation evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sonic-swss-common-codeql-rust-preparation
        path: |
          artifacts/rust-preparation.json
          Cargo.lock
          artifacts/shared-rust-deps/
          MODULE.bazel.lock
        if-no-files-found: error

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ec3cf9c605b848da5f1e41e8452719eb1ccfb9a6 # v2.1.29
      with:
        category: "/language:cpp"
