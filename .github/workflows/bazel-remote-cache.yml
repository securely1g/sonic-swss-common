name: Common managed cache seed for buildimage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: Common to buildimage (amd64)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/buildimage-managed-cache-seed-192'
    runs-on: [self-hosted, linux, x64, buildimage-managed-cache-seed-192]
    timeout-minutes: 90
    env:
      SONIC_BAZEL_MANAGED_CACHE: "1"
      BUILDIMAGE_REVISION: cecfa330f08744212a97cffa090b70c1ab2975c3
    defaults:
      run:
        shell: bash
    steps:
      - name: Install execution tools
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends binutils build-essential ca-certificates ca-certificates-java git python3 tar
      - name: Checkout Common seed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: common
          persist-credentials: false
      - name: Checkout the pinned buildimage consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: securely1g/sonic-buildimage
          ref: ${{ env.BUILDIMAGE_REVISION }}
          path: buildimage
          persist-credentials: false
      - name: Verify source provenance
        run: |
          test "$(git -C common rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C buildimage rev-parse HEAD)" = "$BUILDIMAGE_REVISION"
          test -z "$(git -C common status --porcelain --untracked-files=all)"
          test -z "$(git -C buildimage status --porcelain --untracked-files=all)"
          cmp common/tools/bazel/cache/managed.py buildimage/tools/bazel/cache/managed.py
          printf 'MANAGED_CACHE_SEED_SOURCE=%s BUILDIMAGE=%s\n' "$GITHUB_SHA" "$BUILDIMAGE_REVISION"
      - name: Check seed proof regressions
        run: python3 -B common/tools/bazel/cache/test_cross_repo.py
      - name: Verify runner-managed cache access
        run: |
          python3 -B common/tools/bazel/cache/managed.py \
            --output artifacts/cache-selection.json --github-mask
      - name: Configure verified source mirrors
        run: |
          python3 -B buildimage/tools/bazel/ci/configure_debian_bazel.py
          printf 'SONIC_BAZEL_DOWNLOADER_CONFIG=%s/sonic-source-mirrors-%s.cfg\n' "$RUNNER_TEMP" "$(id -u)" >> "$GITHUB_ENV"
      - name: Verify the installed Bazel release
        run: test "$(/usr/local/lib/bazel-8.5.1 --version)" = "bazel 8.5.1"
      - name: Seed Common image inputs in the configured cache
        run: |
          test -z "$(git -C common status --porcelain --untracked-files=all)"
          test -z "$(git -C buildimage status --porcelain --untracked-files=all)"
          python3 -B common/tools/bazel/cache/cross_repo.py \
            --buildimage "$GITHUB_WORKSPACE/buildimage" \
            --buildimage-revision "$BUILDIMAGE_REVISION" \
            --architecture amd64 --output artifacts/cross-repo.json --seed-for-make
      - name: Retain cache action digests and package hashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-buildimage-cache-amd64
          path: |
            artifacts/*.json
            artifacts/*-MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 14
