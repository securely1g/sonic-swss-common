name: Native Bazel validation

on:
  workflow_call:
    inputs:
      runpath_validation:
        required: false
        type: boolean
        default: false
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      bazel_args:
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Draft validation of the shared-library helper; restore main after publication.
env:
  SONIC_BAZEL_REGISTRY_URL: https://raw.githubusercontent.com/securely1g/sonic-bazel-registry/codex/native-shared-library-preview

jobs:
  native:
    name: ${{ inputs.runpath_validation && 'RUNPATH diagnostic' || 'Native' }} (${{ inputs.arch }}, YANG ${{ matrix.yang }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        yang: [enabled, disabled]
    runs-on: ${{ inputs.runner }}
    container: debian:trixie-20260918
    steps:
      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates gdb git python3 tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Git for the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}-${{ inputs.arch }}-${{ matrix.yang }}
          cache-version: "8.5.1"

      - name: Test registry evidence checks
        run: python3 -m unittest discover -s tools/bazel -p go_validation_test.py -v

      - name: Record Rust source inputs
        shell: bash
        run: |
          test ! -e Cargo.Bazel.lock
          test -z "$(git ls-files Cargo.Bazel.lock)"
          git ls-files --error-unmatch Cargo.lock
          mkdir -p artifacts/validation
          cp Cargo.lock artifacts/validation/
          git rev-parse HEAD > artifacts/validation/source-commit.txt
          git rev-parse HEAD^{tree} > artifacts/validation/source-tree.txt

      - name: Record maintained registry inputs
        run: python3 tools/bazel/go_validation.py record artifacts/validation

      - name: Record native build inputs
        run: |
          test ! -e MODULE.bazel.lock
          mkdir -p artifacts/validation
          printf '%s\n' '${{ matrix.yang }}' > artifacts/validation/feature-mode.txt
          uname -m > artifacts/validation/runner-architecture.txt
          dpkg --print-architecture > artifacts/validation/userspace-architecture.txt
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > artifacts/validation/tested-revision.txt
          bazel version > artifacts/validation/bazel-version.txt

      - name: Check Bazel formatting
        run: bazel run ${{ inputs.bazel_args }} //tools/bazel/buildifier:buildifier.format.check

      - name: Record disk usage before YANG build
        if: matrix.yang == 'enabled'
        continue-on-error: true
        run: bash tools/bazel/record_disk_usage.sh before-yang

      - name: Build and test with YANG
        if: matrix.yang == 'enabled'
        id: yang_build
        run: >-
          bazel test
          ${{ inputs.runpath_validation && '--config=runpath-validation' || '' }}
          ${{ inputs.bazel_args }}
          --lockfile_mode=update
          --nocache_test_results
          --execution_log_compact_file=artifacts/validation/yang-actions.binpb.zst
          --build_event_json_file=artifacts/validation/yang-events.json
          --//tools/bazel:yang_modules=True
          --test_output=errors
          --verbose_failures
          --sandbox_debug
          //common:cfg_schema_generated
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //crates/swss-common:bindings_dir
          //crates/swss-common:swss_common
          //crates/swss-common:swss_common_test
          //tools/bazel/rust:shared_serde_test
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //dist:sonic-db-cli_pkg.debug_symbols
          //pyext:swsscommon_pkg
          //pyext:swsscommon_pkg.debug_symbols
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tests:shared_library_elf_test
          //sonic-db-cli:shared_library_test
          //tests:defaultvalueprovider_ut
          //dist:libswsscommon_package_test
          //dist:package_timestamps_test
          //pyext:swsscommon_package_test

      - name: Record disk usage after YANG build
        if: ${{ always() && matrix.yang == 'enabled' && (steps.yang_build.outcome == 'success' || steps.yang_build.outcome == 'failure') }}
        continue-on-error: true
        run: bash tools/bazel/record_disk_usage.sh after-yang

      - name: Collect YANG package artifacts
        if: matrix.yang == 'enabled'
        run: |
          test ! -e Cargo.Bazel.lock
          git diff --exit-code HEAD -- Cargo.lock
          mkdir -p artifacts/yang artifacts/validation/yang
          cp artifacts/validation/effective.bazelrc artifacts/yang/effective.bazelrc
          cp MODULE.bazel.lock artifacts/yang/
          cp bazel-testlogs/crates/swss-common/swss_common_test/test.xml bazel-testlogs/crates/swss-common/swss_common_test/test.log artifacts/validation/yang/
          mkdir -p artifacts/validation/yang/shared-serde
          cp bazel-testlogs/tools/bazel/rust/shared_serde_test/test.xml bazel-testlogs/tools/bazel/rust/shared_serde_test/test.log artifacts/validation/yang/shared-serde/
          cp MODULE.bazel.lock artifacts/validation/yang/
          mkdir -p artifacts/validation/yang/go
          cp -L bazel-testlogs/goext/swsscommon_runtime_test/test.log bazel-testlogs/goext/swsscommon_runtime_test/test.xml artifacts/validation/yang/go/
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/dist/sonic-db-cli_pkg.debug_symbols.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            bazel-bin/pyext/swsscommon_pkg.debug_symbols.tar \
            artifacts/yang/

      - name: Record disk usage before no-YANG build
        if: matrix.yang == 'disabled'
        continue-on-error: true
        run: bash tools/bazel/record_disk_usage.sh before-no-yang

      - name: Build and test without YANG
        if: matrix.yang == 'disabled'
        id: no_yang_build
        run: >-
          bazel test
          ${{ inputs.runpath_validation && '--config=runpath-validation' || '' }}
          ${{ inputs.bazel_args }}
          --lockfile_mode=update
          --nocache_test_results
          --execution_log_compact_file=artifacts/validation/no-yang-actions.binpb.zst
          --build_event_json_file=artifacts/validation/no-yang-events.json
          --//tools/bazel:yang_modules=False
          --test_output=errors
          --verbose_failures
          --sandbox_debug
          //:libswsscommon
          //:libswsscommon_shared
          //:libswsscommon_consolidated.so
          //:swssloglevel
          //crates/swss-common:bindings_dir
          //crates/swss-common:swss_common
          //crates/swss-common:swss_common_test
          //tools/bazel/rust:shared_serde_test
          //dist:libswsscommon_pkg
          //dist:libswsscommon_pkg.debug_symbols
          //dist:sonic-db-cli_pkg
          //dist:sonic-db-cli_pkg.debug_symbols
          //pyext:swsscommon_pkg
          //pyext:swsscommon_pkg.debug_symbols
          //goext:swsscommon
          //goext:swsscommon_runtime_test
          //tests:status_code_util_test
          //tests:saiaclschema_ut
          //tests:notification_queue_ut
          //tests:interface_ut
          //tests:vrf_ut
          //tests:shared_library_runtime_test
          //tests:shared_library_elf_test
          //sonic-db-cli:shared_library_test
          //dist:libswsscommon_package_test
          //dist:package_timestamps_test
          //pyext:swsscommon_package_test

      - name: Record disk usage after no-YANG build
        if: ${{ always() && matrix.yang == 'disabled' && (steps.no_yang_build.outcome == 'success' || steps.no_yang_build.outcome == 'failure') }}
        continue-on-error: true
        run: bash tools/bazel/record_disk_usage.sh after-no-yang

      - name: Collect no-YANG package artifacts
        if: matrix.yang == 'disabled'
        run: |
          test ! -e Cargo.Bazel.lock
          git diff --exit-code HEAD -- Cargo.lock
          mkdir -p artifacts/no-yang artifacts/validation/no-yang
          cp artifacts/validation/effective.bazelrc artifacts/no-yang/effective.bazelrc
          cp MODULE.bazel.lock artifacts/no-yang/
          cp bazel-testlogs/crates/swss-common/swss_common_test/test.xml bazel-testlogs/crates/swss-common/swss_common_test/test.log artifacts/validation/no-yang/
          mkdir -p artifacts/validation/no-yang/shared-serde
          cp bazel-testlogs/tools/bazel/rust/shared_serde_test/test.xml bazel-testlogs/tools/bazel/rust/shared_serde_test/test.log artifacts/validation/no-yang/shared-serde/
          cp MODULE.bazel.lock artifacts/validation/no-yang/
          mkdir -p artifacts/validation/no-yang/go
          cp -L bazel-testlogs/goext/swsscommon_runtime_test/test.log bazel-testlogs/goext/swsscommon_runtime_test/test.xml artifacts/validation/no-yang/go/
          cp \
            bazel-bin/dist/libswsscommon_pkg.tar \
            bazel-bin/dist/libswsscommon_pkg.debug_symbols.tar \
            bazel-bin/dist/sonic-db-cli_pkg.tar \
            bazel-bin/dist/sonic-db-cli_pkg.debug_symbols.tar \
            bazel-bin/pyext/swsscommon_pkg.tar.gz \
            bazel-bin/pyext/swsscommon_pkg.debug_symbols.tar \
            artifacts/no-yang/

      - name: Upload YANG package artifacts
        if: matrix.yang == 'enabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-yang-${{ inputs.arch }}
          path: artifacts/yang/
          if-no-files-found: error

      - name: Upload no-YANG package artifacts
        if: matrix.yang == 'disabled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-no-yang-${{ inputs.arch }}
          path: artifacts/no-yang/
          if-no-files-found: error

      - name: Retain Go builder failure evidence
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          output_base="$(bazel info output_base)"
          python3 tools/bazel/diagnose_go_builder.py \
            --output-base "$output_base" \
            --destination artifacts/validation/go-builder-failure

      - name: Upload Rust validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-rust-${{ inputs.arch }}-${{ matrix.yang }}
          # Raw Bazel event/action logs can contain environment credentials.
          path: |
            artifacts/validation/
            !artifacts/validation/**/*-events.json
            !artifacts/validation/**/*-actions*
          if-no-files-found: error

      - name: Record resolved Go inputs
        if: always()
        run: python3 tools/bazel/go_validation.py collect artifacts/validation ${{ inputs.bazel_args }}

      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-swss-common-go-validation-${{ inputs.arch }}-${{ matrix.yang }}
          # Keep source, registry and test receipts; omit raw environment logs.
          path: |
            artifacts/validation/
            !artifacts/validation/**/*-events.json
            !artifacts/validation/**/*-actions*
          if-no-files-found: error
